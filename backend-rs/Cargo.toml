[package]
name = "astrocartography-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip", "trace"] }
swisseph-rs = { version = "0.2", default-features = true }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"

[[bin]]
name = "astrocartography-backend"
path = "src/main.rs"
