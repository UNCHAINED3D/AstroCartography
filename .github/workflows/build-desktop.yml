name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt pyinstaller

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Download Moira kernel
        run: python -m moira.download_kernels --yes

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --windowed --name Astrocartography --paths backend `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "backend/data;backend/data" `
            --add-data "${{ runner.home }}/.moira/kernels;kernels" `
            --collect-all moira --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all pydantic `
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on launcher.py

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name Astrocartography --paths backend \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "backend/data:backend/data" \
            --add-data "${HOME}/.moira/kernels:kernels" \
            --collect-all moira --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all pydantic \
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrocartography-${{ runner.os }}
          path: dist/Astrocartography*
